<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>12table_cell</title>
</head>
<body>
    <table border="1"> <!--지역별 홍차 1개만 합치면 되니까 "1"로 작성-->
    <tr>
        <th colspan="2">지역별 홍차</th><!--중국과 인도 및 스리랑카 총 2개를 합쳐야 하므로 "2"로 작성-->
    </tr>
    <tr>
        <th rowspan="3">중국</th> <!--정산소종 기문 운남 총 3개를 합쳐야 하니까 "3"으로 작성-->
        <td>정산소종</td>
    </tr>
    <tr><td>기문</td></tr>
    <tr><td>운남</td></tr>
    <tr>
        <th rowspan="4">인도 및 스리랑카</th> <!-- 아삼 실론 다질링 닐기리 총 4개를 합쳐야 하니까 "4"로 작성-->
        <td>아삼</td>
    </tr>
    <tr><td>실론</td></tr>
    <tr><td>다질링</td></tr>
    <tr><td>닐기리</td></tr>
    </table>
</body>
</html>
