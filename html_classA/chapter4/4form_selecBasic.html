<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3form_selectbasic</title>
</head>
<body>
    
    <h2>1개 항목만 선택 가능한 입력 양식</h2>
    <select>
        <option>우사기</option>
        <option>쿠리만쥬</option>
        <option>치이카와</option>
        <option>하치와레</option>
    </select>

    <h2>여러 항목 선택 가능한 입력 양식</h2> <!--여러 개 선택할 때 컨트롤이나 쉬프트 눌러서 하거나 드래그하면 연속적으로 선택할 수 있음-->
    <select multiple="multiple">
        <option>우사기</option>
        <option>쿠리만쥬</option>
        <option>치이카와</option>
        <option>하치와레</option>
    </select>

    <h2>선택 가능한 옵션 묶기</h2>
    <select>
        <optgroup label="먼작귀">
            <option>우사기</option>
            <option>쿠리만쥬</option>
            <option>치이카와</option>
        </optgroup>
        <optgroup label="리락쿠마">
            <option>코구마</option>
            <option>리락쿠마</option>
        </optgroup>
    </select>



</body>
</html>
